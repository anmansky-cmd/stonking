name: Build RK3588 FFmpeg & MPV for Ubuntu 26.10

on:
  workflow_dispatch: # Запуск сборки вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10 # Сборка происходит строго в окружении Ubuntu 26.10

    steps:
      - name: Install build tools and base dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git libdrm-dev libudev-dev libasound2-dev \
            meson ninja-build python3-pip liblua5.2-dev libass-dev libjpeg-dev libv4l-dev \
            libgbm-dev libwayland-dev wayland-protocols libx11-dev libxext-dev \
            libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev checkinstall patchelf pkg-config

      - name: Build and Package RKMPP
        run: |
          git clone --depth=1 https://github.com/rockchip-linux/mpp.git
          cd mpp
          # Собираем только библиотеки, отключаем генерацию внутренних тестов CMake, которые забивают пути
          cmake -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_SHARED=ON -DENABLE_STATIC=OFF .
          make -j$(nproc)
          
          # Удаляем тестовые исполняемые файлы из директории сборки перед упаковкой, чтобы избежать конфликтов системных путей
          find . -type f -executable -name "*test*" -delete || true
          
          echo "Rockchip MPP decoder library" > description-pak
          # Используем --exclude для защиты системных путей сборщика от затирания
          checkinstall -y --default --pkgname=rockchip-mpp --pkgversion=1.0.0 --pkgrelease=1 \
            --maintainer="custom-build" --provides=rockchip-mpp --exclude="/usr/bin/cmake,/usr/share/cmake" make install
          cp *.deb ../

      - name: Build and Package Librga (Nyanmisaka Mirror)
        run: |
          git clone -b jellyfin-rga --depth=1 https://github.com/nyanmisaka/rk-mirrors.git rkrga
          cd rkrga
          meson setup build_dir --prefix=/usr --libdir=lib --buildtype=release --default-library=shared \
            -Dcpp_args=-fpermissive -Dlibdrm=false -Dlibrga_demo=false
          meson compile -C build_dir
          echo "Rockchip RGA 2D graphics library" > description-pak
          checkinstall -y --default --pkgname=linux-rga --pkgversion=2.1.0 --pkgrelease=1 \
            --maintainer="custom-build" --provides=linux-rga meson install -C build_dir
          cp *.deb ../

      - name: Build and Package FFmpeg-Rockchip (Nyanmisaka)
        run: |
          # Устанавливаем ранее созданные чистые пакеты
          dpkg -i rockchip-mpp*.deb linux-rga*.deb
          ldconfig
          
          # Создаем симлинк, чтобы заголовочные файлы rga корректно подхватились компилятором ffmpeg
          ln -s /usr/include/rga /usr/include/rockchip || true
          
          git clone --depth=1 https://github.com/nyanmisaka/ffmpeg-rockchip.git
          cd ffmpeg-rockchip
          ./configure --prefix=/usr \
            --enable-gpl --enable-version3 \
            --enable-libdrm --enable-rkmpp --enable-rkrga \
            --enable-libv4l2 --enable-shared --disable-static
          make -j$(nproc)
          echo "FFmpeg with Rockchip RK3588 hardware acceleration (nyanmisaka)" > description-pak
          checkinstall -y --default --pkgname=ffmpeg-rockchip --pkgversion=7.1.0 --pkgrelease=1 \
            --maintainer="custom-build" --provides=ffmpeg,libavcodec,libavformat,libavutil make install
          cp *.deb ../

      - name: Build and Package MPV
        run: |
          dpkg -i ffmpeg-rockchip*.deb
          ldconfig
          
          git clone --depth=1 https://github.com/mpv-player/mpv.git
          cd mpv
          meson setup build --prefix=/usr -Dlibmpv=true
          meson compile -C build
          echo "MPV Player linked with FFmpeg-Rockchip" > description-pak
          checkinstall -y --default --pkgname=mpv-rockchip --pkgversion=0.39.0 --pkgrelease=1 \
            --maintainer="custom-build" --provides=mpv meson install -C build
          cp *.deb ../

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-ubuntu-26.10-debs
          path: ./*.deb
